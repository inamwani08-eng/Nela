name: Nightly refresh and deploy

# Every night: re-read the RERA list, fetch details only for new or changed
# projects, refresh Google lookups past their cache limit, rebuild the
# site's data, commit RERA changes, and deploy to GitHub Pages.
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: 'Deploy without crawling RERA'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['web/**', 'pipeline/**', 'data/**', '.github/workflows/refresh.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: pipeline

      # Google results are cached between runs, never committed (Google's
      # terms limit storing them; the scripts expire entries after 30 days).
      - uses: actions/cache@v4
        with:
          path: data/google
          key: google-${{ github.run_id }}
          restore-keys: google-

      - name: Crawl RERA (only on schedule or manual run)
        if: github.event_name != 'push' && inputs.skip_crawl != true
        working-directory: pipeline
        continue-on-error: true
        id: crawl
        run: node src/crawl.js

      - name: Google lookups
        working-directory: pipeline
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node src/geocode.js && node src/places.js

      - name: Build site data
        working-directory: pipeline
        run: node src/build.js

      - name: Commit RERA changes
        if: github.event_name != 'push'
        run: |
          git config user.name "nela-bot"
          git config user.email "nela-bot@users.noreply.github.com"
          git add data/rera-list.json data/details
          git diff --cached --quiet || git commit -m "Nightly RERA refresh $(date -u +%F)"
          git push || echo "Nothing pushed"

      - name: Build website
        working-directory: web
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ vars.VITE_GOOGLE_MAP_ID }}
          VITE_BASE: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
        id: deploy

      - name: Report crawl problems
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "::warning::RERA crawl failed on this runner. RERA Karnataka may block non-Indian servers; run 'npm run refresh' in pipeline/ from a machine in India instead."
